<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LatihanKu – Latihan Soal TKA & SNBT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#0B3A8C;--b2:#0A2A66;--y:#FFC928;--bg:#F4F6FB;--t:#12203F;--w:#fff;--g:#1F9D55;--r:#D64545;--l:#D8DFEE}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo b{color:var(--y)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfe0ff;font:500 .9rem Poppins,sans-serif;padding:6px 12px;border-radius:8px;cursor:pointer}
nav button.on,nav button:hover{background:var(--y);color:var(--b2)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
main{max-width:920px;margin:0 auto;padding:24px 16px 60px}
.hero{background:var(--b);color:#fff;border-radius:20px;padding:36px 28px;margin-bottom:24px;background-image:linear-gradient(115deg,var(--b) 62%,var(--y) 62.2%)}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:0 0 10px;max-width:14em}
.hero p{max-width:26em;margin:0 0 20px;color:#dbe7ff}
.btn{background:var(--y);color:var(--b2);border:0;font:700 1rem Poppins,sans-serif;padding:12px 22px;border-radius:999px;cursor:pointer}
.btn.alt{background:var(--w);border:2px solid var(--b);color:var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--w);border:1px solid var(--l);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;font-size:1rem;color:var(--b)}
.card p{margin:0;font-size:.9rem}
h2{color:var(--b);margin:0 0 12px}
select,input,textarea{font:inherit;padding:9px 12px;border:1px solid var(--l);border-radius:10px;background:#fff;max-width:100%}
textarea{width:100%}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--l);border-radius:12px;padding:10px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--b)}
.opt.ok{border-color:var(--g);background:#e8f7ee}
.opt.no{border-color:var(--r);background:#fdecec}
.tag{display:inline-block;background:#E5ECFB;color:var(--b);font-size:.75rem;padding:2px 10px;border-radius:99px;margin-right:6px}
.exp{background:#FFF7DB;border-left:5px solid var(--y);padding:12px 14px;border-radius:8px;margin-top:12px;font-size:.92rem}
.exp ol{margin:6px 0 0;padding-left:20px}
.score{font-size:3rem;font-weight:800;color:var(--b)}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.85rem}
.row i{display:block;height:14px;background:var(--y);border-radius:7px}
.post{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px 14px;margin:10px 0}
.post small{color:#5b6a8a}
.hide{display:none}
#pro{background:var(--y);color:var(--b2);font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;margin-left:auto}
.lock{background:#EEF2FB;border:2px dashed var(--b);border-radius:12px;padding:14px;margin-top:12px;font-size:.9rem}
.lock .btn{margin-top:8px;padding:8px 18px;font-size:.9rem}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.plan.pro{border:3px solid var(--y)}
.plan ul{padding-left:18px;font-size:.9rem}.plan li{margin:4px 0}
.plan .pr{font-size:1.8rem;font-weight:800;color:var(--b)}
.f input,.f select{width:100%;margin:4px 0 10px}
.adm header{background:#1a1a2e;border-bottom:4px solid var(--y)}
code{background:#E5ECFB;padding:1px 6px;border-radius:6px}
#dk{background:none;border:1px solid #3a5aa8;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;margin-left:auto}
:root[data-theme="dark"]{--bg:#0F1626;--w:#182238;--t:#E7ECFB;--l:#2A3555}
.pbar{background:#E5ECFB;border-radius:99px;height:8px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--y)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--w);border:1px solid var(--l);border-radius:12px;padding:10px;text-align:center;font-size:.85rem}
.stat b{display:block;font-size:1.4rem;color:var(--b)}
.cal{display:flex;gap:6px;margin:10px 0}
.cal span{width:26px;height:26px;border-radius:8px;background:var(--l);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--t)}
.cal span.on{background:var(--y);color:var(--b2);font-weight:700}
.navn{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.navn button{width:30px;height:30px;border-radius:8px;border:1px solid var(--l);background:var(--w);color:var(--t);cursor:pointer;font-size:.8rem}
.navn button.cur{border-color:var(--b);border-width:2px;font-weight:700}
.navn button.ans{background:#E5ECFB}
.navn button.mk{background:#FFF3C4}
.badge{display:inline-block;background:#E5ECFB;color:var(--b);border-radius:99px;padding:4px 12px;font-size:.8rem;margin:2px}
table.cmp{width:100%;border-collapse:collapse;font-size:.85rem;background:var(--w)}
table.cmp td,table.cmp th{border:1px solid var(--l);padding:7px 9px;text-align:left}
.examlock,.examlock *{user-select:none;-webkit-user-select:none}
.examlock img{pointer-events:none;-webkit-touch-callout:none}
#wm{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.10;display:flex;flex-wrap:wrap;align-content:flex-start;overflow:hidden;transform:rotate(-18deg) scale(1.3);color:#000}
#wm span{display:block;width:33%;padding:26px 6px;white-space:nowrap;font-size:.7rem}
@media print{.examlock{display:none!important}}
footer{text-align:center;font-size:.8rem;color:#5b6a8a;padding:20px}
@media(prefers-reduced-motion:no-preference){.hero{animation:in .5s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}

/* ===== Admin redesign ===== */
body.adm{background:#f5f7fb}
.adm header{height:64px;padding:10px 24px;background:#101828;border-bottom:0;box-shadow:0 2px 12px rgba(16,24,40,.12)}
.adm header .logo{font-size:1.15rem}
.adm header nav{gap:2px}
.adm header nav button{color:#cbd5e1;padding:8px 12px}
.adm header nav button.on,.adm header nav button:hover{background:#ffc928;color:#101828}
.admin-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px);max-width:1180px;margin:auto}
.admin-side{background:#fff;border-right:1px solid #e4e7ec;padding:20px 14px}
.admin-side .side-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#98a2b3;font-weight:700;padding:8px 12px}
.admin-side button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#344054;padding:11px 12px;border-radius:10px;font:600 .88rem Poppins,sans-serif;text-align:left;cursor:pointer;margin:2px 0}
.admin-side button:hover,.admin-side button.on{background:#eef4ff;color:#0b3a8c}
.admin-side .side-logout{margin-top:18px;color:#b42318}
.admin-main{padding:28px;min-width:0}
.admin-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.admin-top h1{margin:0;color:#101828;font-size:1.7rem}
.admin-top p{margin:4px 0 0;color:#667085;font-size:.9rem}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.admin-kpi{background:#fff;border:1px solid #eaecf0;border-radius:14px;padding:16px}
.admin-kpi .ico{font-size:1.2rem}
.admin-kpi b{display:block;font-size:1.7rem;color:#101828;margin-top:4px}
.admin-kpi span{font-size:.78rem;color:#667085}
.admin-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.admin-quick .card{padding:20px;border-radius:16px}
.admin-quick .quick-icon{font-size:1.8rem}
.admin-quick h3{margin:8px 0 3px;color:#101828}
.admin-quick p{font-size:.84rem;color:#667085;margin:0 0 14px}
.admin-section{background:#fff;border:1px solid #eaecf0;border-radius:16px;padding:18px;margin-bottom:16px}
.admin-section h3{margin:0 0 12px;color:#101828}
.admin-note{background:#f8f9fc;border:1px dashed #d0d5dd;border-radius:10px;padding:10px 12px;font-size:.82rem;color:#667085}
.admin-table{width:100%;border-collapse:collapse;font-size:.84rem}
.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left}
.admin-table th{color:#667085;font-weight:600}
.admin-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.admin-search{flex:1;min-width:220px}
.admin-search input{width:100%;padding:11px 13px}
.admin-form-grid{display:grid;grid-template-columns:1fr 150px;gap:10px}
.admin-option{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;margin:7px 0}
.admin-option input[type=text]{width:100%}
.admin-sticky-actions{position:sticky;bottom:10px;background:rgba(255,255,255,.96);border:1px solid #eaecf0;border-radius:12px;padding:10px;display:flex;gap:8px;justify-content:flex-end;margin-top:14px;box-shadow:0 4px 16px rgba(16,24,40,.08)}
.pkg-select-list{max-height:430px;overflow:auto;border:1px solid #eaecf0;border-radius:12px}
.pkg-q{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer}
.pkg-q:hover{background:#f8faff}
.pkg-q:last-child{border-bottom:0}
.pkg-q small{color:#667085}
.admin-empty{text-align:center;padding:28px;color:#667085}
.admin-badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef4ff;color:#0b3a8c;font-size:.72rem;font-weight:600}
@media(max-width:850px){
 .admin-wrap{grid-template-columns:1fr}
 .admin-side{display:none}
 .admin-main{padding:18px 14px}
 .admin-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .admin-quick{grid-template-columns:1fr}
 .admin-top{flex-direction:column}
}
@media(max-width:520px){
 .admin-kpis{grid-template-columns:1fr 1fr}
 .admin-form-grid{grid-template-columns:1fr}
}

.admin-side{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto}
.admin-main{animation:in .3s ease-out}
.admin-section textarea,.admin-section input[type=text]{width:100%}
.admin-section select,.admin-section input{min-height:42px}
.admin-kpi button{display:block}
.admin-option input[type=radio]{width:20px;height:20px;accent-color:#0b3a8c}
:root[data-theme=dark] body.adm{background:#0F1626}
:root[data-theme=dark] .adm .admin-side,:root[data-theme=dark] .adm .admin-section,:root[data-theme=dark] .adm .admin-kpi,:root[data-theme=dark] .adm .admin-sticky-actions{background:var(--w);border-color:var(--l)}
:root[data-theme=dark] .adm .admin-top h1,:root[data-theme=dark] .adm .admin-section h3,:root[data-theme=dark] .adm .admin-kpi b,:root[data-theme=dark] .adm .admin-side button{color:var(--t)}
:root[data-theme=dark] .adm .admin-note,:root[data-theme=dark] .adm .pkg-q:hover{background:#0F1626}
@media(max-width:850px){.admin-side{display:flex!important;position:static;height:auto;gap:4px;padding:8px 10px;border-right:0;border-bottom:1px solid #e4e7ec;overflow-x:auto}.admin-side .side-title{display:none}.admin-side button{width:auto;white-space:nowrap;margin:0}.admin-side .side-logout{margin:0}.admin-form-grid,.admin-form-grid[style]{grid-template-columns:1fr!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   SUPABASE ONLINE MODE - LatihanKu

const SUPABASE_URL = "https://jwzdpfvmhdabkjwitybj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nEGrboZiApzCpKbaUtecxQ_x9sRrWcc";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let DBPROFILE = null;
let DBSYNCING = false;

async function dbLoadProfile(){
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(!user){ DBPROFILE=null; st.set("sess",""); return null; }
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error){ console.error(error); return null; }
  if(data){
    DBPROFILE=data;
    st.set("sess",data.username);
    const U=users(); U[data.username]={...(U[data.username]||{}),u:data.username,n:data.display_name||data.username,xp:data.xp||0,k:U[data.username]?.k||"12",dbid:data.id}; st.set("users",U);
  }
  return data;
}

async function dbSyncStart(){
  if(DBSYNCING)return; DBSYNCING=true;
  try{ await dbLoadProfile(); }finally{ DBSYNCING=false; render(); if(location.hash==="#diskusi") renderPosts(); }
}

supabaseClient.auth.onAuthStateChange((_event,session)=>{
  if(!session){ DBPROFILE=null; st.set("sess",""); }
  else dbLoadProfile().then(()=>render());
});

async function dbLogin(username,password){
  const email=username.toLowerCase().trim()+"@latihanku.local";
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)return {error};
  await dbLoadProfile(); return {data};
}

async function dbRegister(meta,password){
  const email=meta.username.toLowerCase()+"@latihanku.local";
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{username:meta.username,display_name:meta.display_name}}});
  if(error)return {error};
  if(data.session) await dbLoadProfile();
  return {data};
}

async function dbSaveAttempt(q,answer,isCorrect,score,timeSpent){
  if(!DBPROFILE)return;
  const {error}=await supabaseClient.from("question_attempts").insert({user_id:DBPROFILE.id,question_id:String(q.id),answer:answer==null?null:String.fromCharCode(65+answer),is_correct:!!isCorrect,score:score||0,time_spent:timeSpent||0});
  if(error)console.error("attempt",error);
}

async function dbAwardXP(amount){
  if(!DBPROFILE||!amount)return;
  const next=(DBPROFILE.xp||0)+amount;
  const level=(await supabaseClient.rpc("calculate_level",{user_xp:next})).data||lvl(next);
  const {data,error}=await supabaseClient.from("profiles").update({xp:next,level}).eq("id",DBPROFILE.id).select("*").single();
  if(!error&&data){DBPROFILE=data;const U=users(),u=data.username;U[u]={...(U[u]||{}),xp:data.xp,n:data.display_name||u};st.set("users",U);}
}

async function dbLeaderboard(){
  const {data,error}=await supabaseClient.from("leaderboard").select("rank,id,username,display_name,avatar_url,xp,level,streak").order("xp",{ascending:false}).limit(10);
  if(error){console.error(error);return [];} return data||[];
}

async function dbRenderBoard(){
  const el=$("#boardlist"); if(!el)return;
  const L=await dbLeaderboard(); const meId=DBPROFILE&&DBPROFILE.id;
  el.innerHTML=L.length?L.map((x,i)=>`<div class="row"><span style="width:26px">${["🥇","🥈","🥉"][i]||(i+1)}</span><span style="flex:1">${esc(x.display_name||x.username)}${x.id===meId?" (kamu)":""}</span><b>${x.xp||0} XP</b></div>`).join(""):"<p>Belum ada data online.</p>";
}

async function dbPosts(){
  const {data,error}=await supabaseClient.from("discussions").select("id,user_id,title,content,material,created_at,profiles(username,display_name),comments(id,user_id,content,created_at,profiles(username,display_name)),discussion_likes(user_id)").order("created_at",{ascending:false}).limit(200);
  if(error){console.error(error);return [];} return data||[];
}

  const el=$("#ps"); if(!el)return;

  if(cf)P=P.filter(p=>p.material===cf); if(q)P=P.filter(p=>(p.title||p.content||"").toLowerCase().includes(q));
  const cu=DBPROFILE&&DBPROFILE.id;
  el.innerHTML=P.length?P.map(p=>{
    const likes=p.discussion_likes||[], comments=p.comments||[];
    return `<div class="post"><span class="tag">${esc(p.material||"Umum")}</span><small> ${esc(p.profiles?.display_name||p.profiles?.username||"Pengguna")} · ${new Date(p.created_at).toLocaleDateString("id-ID")}</small><h3 style="margin:8px 0 4px">${esc(p.title)}</h3><div>${esc(p.content)}</div>

    ${comments.map(rp=>`<div style="margin:6px 0 0 16px;padding-left:10px;border-left:3px solid var(--l)"><small>${esc(rp.profiles?.display_name||rp.profiles?.username||"Pengguna")} · ${new Date(rp.created_at).toLocaleDateString("id-ID")}</small><div>${esc(rp.content)}</div></div>`).join("")}
    <div style="margin-top:6px;display:flex;gap:6px"><input id="r_${p.id}" placeholder="Balas…" style="flex:1"><button class="btn alt" style="padding:6px 12px" onclick="reply('${p.id}')">Balas</button></div></div>`;
  }).join(""):"<p>Belum ada diskusi online di kategori ini. Mulai dengan pertanyaan pertamamu.</p>";
}

  if(!DBPROFILE){alert("Silakan masuk terlebih dahulu.");return;}

  $("#pt").value=""; await renderPosts();
}

  if(!DBPROFILE){alert("Silakan masuk terlebih dahulu.");return;}
  const {data}=await supabaseClient.from("discussion_likes").select("discussion_id").eq("discussion_id",id).eq("user_id",DBPROFILE.id).maybeSingle();

doReg=async function(){

window.addEventListener("load",()=>{dbSyncStart();});
</script>
